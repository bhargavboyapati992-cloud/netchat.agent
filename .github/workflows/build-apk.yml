name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    # Safe Step: Dynamically searches and updates PLACEHOLDER_KEY across directories securely
    - name: Inject Secure Groq API Key
      run: |
        find . -name "GeminiApiClient.kt" -exec sed -i 's/"PLACEHOLDER_KEY"/"${{ secrets.GROQ_API_KEY }}"/g' {} +

    # Dynamic Step: Configures properties across all available nested root layers
    - name: Configure Gradle Compiler Properties Bypass
      run: |
        find . -maxdepth 2 -type d -exec sh -c 'echo "android.experimental.lifecycle.compose=true" >> {}/local.properties 2>/dev/null || true' \;
        find . -maxdepth 2 -type d -exec sh -c 'echo "kotlin.experimental.tryK2=false" >> {}/local.properties 2>/dev/null || true' \;

    # Robust Step: Generates a fresh gradlew wrapper locally if original execution file goes missing
    - name: Verify or Generate Gradle Wrapper Script
      run: |
        if [ ! -f gradlew ]; then
          echo "Gradle wrapper missing from root. Building fresh script execution trees..."
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: "**/build/outputs/apk/debug/*.apk"
