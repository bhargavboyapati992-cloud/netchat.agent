name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # Automatically uses latest non-deprecated node action
      with:
        distribution: 'temurin'
        java-version: '17'

    # Secure Step: Dynamically replaces placeholder text with your vault hidden key
    - name: Inject Secure Groq API Key
      run: |
        find . -name "GeminiApiClient.kt" -exec sed -i 's/"PLACEHOLDER_KEY"/${{ secrets.GROQ_API_KEY }}/g' {} +

    # Dynamic Path Solver: Finds the exact location of gradlew and compiles right inside that folder!
    - name: Locate Gradle Root and Build APK
      run: |
        GRADLE_ROOT=$(find . -name "gradlew" -printf '%h\n' -print -quit)
        if [ -z "$GRADLE_ROOT" ]; then
          echo "gradlew not found! Generating safe gradle execution tree wrapper..."
          gradle wrapper --gradle-version 8.5
          GRADLE_ROOT="."
        fi
        
        echo "Found gradle root at: $GRADLE_ROOT"
        cd "$GRADLE_ROOT"
        chmod +x gradlew
        
        # Inject structural compiler parameters directly into local properties
        echo "android.experimental.lifecycle.compose=true" >> local.properties
        echo "kotlin.experimental.tryK2=false" >> local.properties
        
        # Explicitly run the compilation task bypassing the modern cache bugs
        ./gradlew clean assembleDebug --no-daemon --no-configuration-cache -Pandroid.overrideVersionCheck=true -Pandroid.experimental.lifecycle.compose=true

    # Flexible Artifact Collector: Searches recursively across all folders for the output APK file
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: "**/build/outputs/apk/debug/*.apk"
