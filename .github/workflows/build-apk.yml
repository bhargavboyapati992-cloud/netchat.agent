name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Safe Step: Dynamically searches and updates PLACEHOLDER_KEY across directories securely
    - name: Inject Secure Groq API Key
      run: |
        find . -name "GeminiApiClient.kt" -exec sed -i 's/"PLACEHOLDER_KEY"/${{ secrets.GROQ_API_KEY }}/g' {} +

    # Robust Step: Configures standard properties and strips incompatible plugin components dynamically 
    - name: Configure Gradle Compiler Properties Bypass
      run: |
        find . -maxdepth 2 -type d -exec sh -c 'echo "android.experimental.lifecycle.compose=true" >> {}/local.properties 2>/dev/null || true' \;
        find . -maxdepth 2 -type d -exec sh -c 'echo "kotlin.experimental.tryK2=false" >> {}/local.properties 2>/dev/null || true' \;

    # Core Fix: Force clear caching configuration elements to override VersionCheck limitations
    - name: Clean and Build with Safe Native Wrapper 
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace -Pandroid.experimental.lifecycle.compose=true
        else
          echo "Building local execution wrapper structures using standard safe runner..."
          gradle clean assembleDebug --no-daemon --stacktrace -Pandroid.experimental.lifecycle.compose=true
        fi

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: "**/build/outputs/apk/debug/*.apk"
