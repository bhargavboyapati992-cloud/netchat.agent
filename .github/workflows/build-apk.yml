name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # Official Action: Forcefully accepts all Google Android licenses at the server level automatically
    - name: Setup Android SDK and Accept Licenses
      uses: android-actions/setup-android@v3

    # Dynamic Path Solver & Force Upgrade to Gradle 9.3.1 to match your AGP requirements
    - name: Locate Gradle Root and Build APK
      run: |
        GRADLE_ROOT=$(find . -name "gradlew" -printf '%h\n' -print -quit)
        if [ -z "$GRADLE_ROOT" ]; then
          GRADLE_ROOT="."
        fi
        
        echo "Found gradle root at: $GRADLE_ROOT"
        cd "$GRADLE_ROOT"
        
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew
        
        # Inject structural compiler parameters directly into local properties
        echo "android.experimental.lifecycle.compose=true" >> local.properties
        echo "kotlin.experimental.tryK2=false" >> local.properties
        
        # Run clean production build execution seamlessly
        ./gradlew clean assembleDebug --no-daemon --no-configuration-cache

    # Aggressive Collector: Moves the final APK to workspace root safely
    - name: Stage Generated APK
      run: |
        mkdir -p final-apk-staged
        find . -name "*.apk" -exec cp {} final-apk-staged/ \;

    # Guaranteed Upload Step
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: final-apk-staged/*.apk
        if-no-files-found: error
