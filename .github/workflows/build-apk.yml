name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # Secure Injection: Replaces only the inside text while keeping the outer double quotes intact
    - name: Inject Secure Groq API Key from Secrets
      run: |
        find . -name "GeminiApiClient.kt" -exec sed -i 's/ENV_GROQ_API_KEY_PLACEHOLDER/${{ secrets.GROQ_API_KEY }}/g' {} +

    # Dynamic Path Solver & Force Upgrade to Gradle 9.3.1 to match your AGP 9.1.1 requirements
    - name: Locate Gradle Root and Build APK
      run: |
        GRADLE_ROOT=$(find . -name "gradlew" -printf '%h\n' -print -quit)
        if [ -z "$GRADLE_ROOT" ]; then
          GRADLE_ROOT="."
        fi
        
        echo "Found gradle root at: $GRADLE_ROOT"
        cd "$GRADLE_ROOT"
        
        # Force upgrading wrapper configuration to 9.3.1 to avoid version errors
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew
        
        # Inject structural compiler parameters directly into local properties
        echo "android.experimental.lifecycle.compose=true" >> local.properties
        echo "kotlin.experimental.tryK2=false" >> local.properties
        
        # Run clean production build execution with correct matching compiler
        ./gradlew clean assembleDebug --no-daemon --no-configuration-cache

    # 🛠️ Aggressive Collector: Copies the generated APK straight to the workspace root so upload-artifact can't miss it
    - name: Stage Generated APK
      run: |
        mkdir -p final-apk-staged
        find . -name "*.apk" -exec cp {} final-apk-staged/ \;
        echo "Staged files inside folder:"
        ls -la final-apk-staged/

    # Guaranteed Upload Step
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: final-apk-staged/*.apk
        if-no-files-found: error # Force build to show red error if it fails to find the staged file
