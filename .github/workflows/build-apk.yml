name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # Official Action: Forcefully accepts all Google Android licenses at the server level automatically
    - name: Setup Android SDK and Accept Licenses
      uses: android-actions/setup-android@v3

    # Direct Root Compilation: No clumsy search scripts, directly executes from the root tracking tree
    - name: Run Direct Production Build Execution
      run: |
        # Upgrade gradle structure safely inside main workspace directory
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew
        
        # Inject structural compiler parameters directly into local properties
        echo "android.experimental.lifecycle.compose=true" >> local.properties
        echo "kotlin.experimental.tryK2=false" >> local.properties
        
        # Build clean assemble debug APK
        ./gradlew clean assembleDebug --no-daemon --no-configuration-cache

    # Collector Step: Grabs the output APK and stages it safely
    - name: Stage Generated APK
      run: |
        mkdir -p final-apk-staged
        find . -name "*.apk" -exec cp {} final-apk-staged/ \;

    # Guaranteed Upload Step
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: final-apk-staged/*.apk
        if-no-files-found: error
