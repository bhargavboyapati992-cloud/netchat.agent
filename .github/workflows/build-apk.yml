name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # Safe Step: Directly injects the secure secret key into local.properties for the compiler
    - name: Configure Secure Properties Setup
      run: |
        GRADLE_ROOT=$(find . -name "gradlew" -printf '%h\n' -print -quit)
        if [ -z "$GRADLE_ROOT" ]; then GRADLE_ROOT="."; fi
        cd "$GRADLE_ROOT"
        
        echo "android.experimental.lifecycle.compose=true" >> local.properties
        echo "kotlin.experimental.tryK2=false" >> local.properties
        
        # Injecting the secret safely as a system property text line
        echo "groq.api.key=${{ secrets.GROQ_API_KEY }}" >> local.properties

    # Dynamic Path Solver & Force Upgrade to Gradle 9.3.1 to match your AGP requirements
    - name: Locate Gradle Root and Build APK
      run: |
        GRADLE_ROOT=$(find . -name "gradlew" -printf '%h\n' -print -quit)
        if [ -z "$GRADLE_ROOT" ]; then GRADLE_ROOT="."; fi
        cd "$GRADLE_ROOT"
        
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew
        
        # Run clean production build execution
        ./gradlew clean assembleDebug --no-daemon --no-configuration-cache
      env:
        # Exposing the vault secret safely to the environment runner context matrix
        GROQ_API_KEY_ENV: ${{ secrets.GROQ_API_KEY }}

    # Aggressive Collector
    - name: Stage Generated APK
      run: |
        mkdir -p final-apk-staged
        find . -name "*.apk" -exec cp {} final-apk-staged/ \;

    # Guaranteed Upload Step
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: final-apk-staged/*.apk
        if-no-files-found: error
