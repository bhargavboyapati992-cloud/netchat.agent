name: NetChat Unlimited APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Secure Step: Dynamically replaces target PLACEHOLDER_KEY with your vault hidden key
    - name: Inject Secure Groq API Key
      run: |
        find . -name "GeminiApiClient.kt" -exec sed -i 's/"PLACEHOLDER_KEY"/${{ secrets.GROQ_API_KEY }}/g' {} +

    # Compiler Patch Step: Injects exact compatibility overrides strictly into all local.properties directories
    - name: Configure Gradle Compiler Properties Bypass
      run: |
        find . -maxdepth 3 -type d -exec sh -c 'echo "android.experimental.lifecycle.compose=true" >> {}/local.properties 2>/dev/null || true' \;
        find . -maxdepth 3 -type d -exec sh -c 'echo "kotlin.experimental.tryK2=false" >> {}/local.properties 2>/dev/null || true' \;
        find . -maxdepth 3 -type d -exec sh -c 'echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> {}/gradle.properties 2>/dev/null || true' \;

    # Version Shield Step: Force installs a guaranteed backward-compatible stable Gradle Wrapper 8.5 to stop modern 9.7 crashes
    - name: Setup Force-Downgrade Stable Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew

    # Compilation Step: Standard safe clean production execution
    - name: Build Secure Unlimited Debug APK
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetChat-Unlimited-CN-APK
        path: "**/build/outputs/apk/debug/*.apk"
